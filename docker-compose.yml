version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: erakshak_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erakshak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erakshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erakshak_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=E-Rakshak Telecom Ingestion
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/erakshak
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/erakshak
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
